<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            padding: 10%;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            border: 1px solid #000;
            color: white;
            height:100px;
        }
        li{
            min-width: 100px;
        }

        li:nth-of-type(1){
            background: red;
        }
        li:nth-of-type(2){
            background: blue;
        }
        li:nth-of-type(3){
            background: gray;
        }

        .flex1{
            display : flex;
            align-items: stretch;
        }
        .flex2{
            display : flex;
            align-items: flex-start;
        }
        .flex3{
            display : flex;
            align-items: flex-end;
        }
        .flex4{
            display : flex;
            align-items: center;
        }   
    </style>
    <h3>align-items : strecth (기본값)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>align-items : flex-start</h3>
    <ul class="flex2">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
    
    <h3>align-items : flex-end</h3>
    <ul class="flex3">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>align-items : center</h3>
    <ul class="flex4">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
</body>
</html>
