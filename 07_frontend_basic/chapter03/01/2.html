<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            padding: 0 10%;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            border: 1px solid #000;
        }
        li{
            min-width: 100px;
            min-height: 100px;
        }

        li:nth-of-type(1){
            background: red;
        }
        li:nth-of-type(2){
            background: blue;
        }
        li:nth-of-type(3){
            background: gray;
        }

        .flex1{
            display : flex;
            justify-content: flex-start;
        }
        .flex2{
            display : flex;
            justify-content: flex-end;
        }
        .flex3{
            display : flex;
            justify-content: center;
        }
    </style>
    <h3>justify-content: flex-start(기본값)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>justify-content: flex-end</h3>
    <ul class="flex2">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
    
    <h3>justify-content: center</h3>
    <ul class="flex3">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
</body>
</html>
