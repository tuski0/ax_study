<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            padding: 10%;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
            border: 1px solid #000;
            color: white;
        }

        li:nth-of-type(1){
            background: red;
        }
        li:nth-of-type(2){
            background: blue;
        }
        li:nth-of-type(3){
            background: gray;
        }

        .flex1{
            display : flex;
        }
        .flex2{
            display : flex;
            flex-direction: row-reverse;
        }
        .flex3{
            display : flex;
            flex-direction: column;
        }
        .flex4{
            display : flex;
            flex-direction: column-reverse;
        }
    </style>
    <h3>flex-direction : row ( 좌 -> 우 )</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>flex-direction : row-reverse ( 우 -> 좌 )</h3>
    <ul class="flex2">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
    
    <h3>flex-direction : column ( 상 -> 하 )</h3>
    <ul class="flex3">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <h3>flex-direction : column-reverse ( 하 -> 상 )</h3>
    <ul class="flex4">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>
</body>
</html>
