<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>팀 스파르타</title>
  </head>
  <body>
    <h1>회원 가입</h1>
    <form method='POST' action="sign_up.html">
      이메일 <input type="email" name="email" value="user01@test.org" required/> <br>
      비밀번호 <input  type="password" name="password" required/> <br>
      비밀번호 확인 <input type="password" name="confirm_password" required/> <br>
      회원 이름 <input type="'text" name="user_name" value="user01" required/> <br>
      성별
          <label>
          <input type="radio" name="gender" value="FEMALE" checked>여성
          <input type="radio" name="gender" value="MALE" >남성
          </label> 
          <br>
      취미
          <input type="checkbox" id="hobby_game" name="hobby" value="GAME" checked/> 
          <label for="hobby_game">게임</label>
          <input type="checkbox" id="hobby_read" name="hobby" value="READ"/> 
          <label for="hobby_read">독서</label>
          <input type="checkbox" id="hobby_movie" name="hobby" value="MOVIE" checked/>
          <label for="hobby_movie">영화</label>
          <br>

      자기소개 <textarea name="introduction" rows="5" cols="100" placeholder="두 줄 이상 입력하세요"></textarea>"
      <br><br>
      태어난 년도
      <select name="birth_year" multiple size="2">
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017" selected>2017</option>
        <option value="2016">2016</option>
      </select>
      <br>

      <button type="submit"> 회원가입 </button>
    </form>
  </body>
</html>
