<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        /* 그룹 선택자 */
        a, p, .greeting{
            color: green;
        }
        span.greeting{
            color: orange
        }
        /* 속성 선택자 : 속성명*/
        input[type]{
            border:3px solid red;
        }
        /* 속성 선택자 : 속성값 */
        input[type='number']{
            border-color : blue;
        }
        a[href^='tel']{
            background: gray;
        }
        a[href$="com"]{
            background: olive;
        }
        a[href$=".net"]{
            background: yellow;
        }
    </style>
    <a href="https://www.naver.com">네이버</a>
    <a href="https://daum.net">다음</a>
    <a href="tel:010-1000-1000">전화 걸기</a>
    <p>단락</p>
    <div class="greeting">안녕하세요.</div>
    <span class="greeting">반갑습니다.</span>

    <hr>

    <input type="text" />
    <input type="number" />
</body>
</html>
